<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>spatial-canvas · embed test</title>
    <style>
      body { font: 14px/1.5 ui-monospace, monospace; background: #0a0a0c; color: #e8e8ea; margin: 0; padding: 24px; }
      .demo { max-width: 800px; margin: 0 auto; display: grid; gap: 24px; }
      spatial-canvas { width: 100%; height: 400px; border: 1px solid #222; background: #000; }
      h1 { font-size: 18px; margin: 0 0 8px; }
      .note { color: #889; font-size: 12px; }
    </style>
  </head>
  <body>
    <div class="demo">
      <h1>spatial-canvas · embed test</h1>
      <div>
        <p class="note">Aynı bundle, mode=embed bayrağı. UI mount edilmiyor, depth modeli lazy.</p>
        <spatial-canvas src="./thumbnail.jpg"></spatial-canvas>
      </div>
      <div>
        <p class="note">Preset ile (mode=ascii):</p>
        <spatial-canvas
          src="./thumbnail.jpg"
          preset='{"version":1,"name":"test","mediaType":"upload","gridSize":384,"camera":{"position":[0,0,3.5],"target":[0,0,0]},"graph":{"nodes":[{"id":"media","type":"media","params":{}},{"id":"depth","type":"depth","params":{}},{"id":"particles","type":"particles","params":{}},{"id":"renderer","type":"renderer","params":{"mode":"ascii"}},{"id":"feedback","type":"feedback","params":{}},{"id":"output","type":"output","params":{}}],"edges":[{"from":"media","to":"depth"},{"from":"depth","to":"particles"},{"from":"particles","to":"renderer"},{"from":"renderer","to":"feedback"},{"from":"feedback","to":"output"}]}}'
        ></spatial-canvas>
      </div>
      <div>
        <p class="note">WebGL yoksa statik görsel fallback (tarayıcıyı kısıtlayarak test et):</p>
        <spatial-canvas src="./thumbnail.jpg" style="--force-fallback: 1"></spatial-canvas>
      </div>
    </div>
    <script type="module" src="/src/embed.ts"></script>
  </body>
</html>
